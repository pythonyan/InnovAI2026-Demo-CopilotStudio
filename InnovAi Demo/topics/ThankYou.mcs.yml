mcs.metadata:
  componentName: Grazie
  description: This topic triggers when the user says thank you.
kind: AdaptiveDialog
modelDescription: "Questo strumento è in grado di gestire query come queste: grazie, grazie tanto"
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Thank you
    includeInOnSelectIntent: false
    triggerQueries:
      - thanks
      - thank you
      - thanks so much
      - ty

  actions:
    - kind: SendActivity
      id: sendMessage_9iz6v7
      activity: E' stato un piacere.