mcs.metadata:
  componentName: Fallback
  description: This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: Mi dispiace, non posso aiutarti in questo. Puoi provare a dirmi altro?

      elseActions:
        - kind: BeginDialog
          id: 5aXj5M
          dialog: cra3b_Sharp4AiDemo.topic.Escalate