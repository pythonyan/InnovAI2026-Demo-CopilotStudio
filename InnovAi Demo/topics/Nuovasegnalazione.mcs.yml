  actions:
    - kind: Question
      id: question_U4v8tm
      interruptionPolicy:
        allowInterruption: true

      variable: Global.TestoSegnalazione
      prompt: Descrivi brevemente il problema
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_t5FAg4
      interruptionPolicy:
        allowInterruption: true

      variable: init:Global.CategoriaSegnalazione
      prompt: In quale categoria rientra? (tecnico / amministrativo / altro)
      entity:
        kind: EmbeddedEntity
        definition:
          kind: ClosedListEntity
          items:
            - id: tecnico
              displayName: tecnico

            - id: amministrativo
              displayName: amministrativo

            - id: altro
              displayName: altro

    - kind: SendActivity
      id: sendActivity_HjzSNS
      activity: Grazie. Sto cercando i casi simili già gestiti...

    - kind: BeginDialog
      id: wsMVbr
      input: {}
      dialog: cra3b_Sharp4AiDemo.action.InnovAIDemoAPI-InnovAIDemoAPI
      output:
        binding:
          tickets: Topic.tickets

    - kind: SetVariable
      id: setVariable_init_summary
      variable: Topic.TicketSummary
      value: "\"\""

    - kind: Foreach
      id: foreach_wSJ4z9
      items: =Topic.tickets
      value: init:Topic.CurrentTicket
      index: init:Topic.LoopIndex
      actions:
        - kind: SetVariable
          id: setVariable_build_summary
          variable: Topic.TicketSummary
          value: "=Concatenate(Topic.TicketSummary, \"• \", Left(Topic.CurrentTicket.titolo, 80), Char(10), \"  Soluzione: \", If(IsBlank(Topic.CurrentTicket.soluzione), \"N/D\", Left(Topic.CurrentTicket.soluzione, 150)), Char(10), Char(10))"

    - kind: SendActivity
      id: sendActivity_summary_ready
      activity: Ho trovato alcuni casi simili per la tua segnalazione

    - kind: SendActivity
      id: sendActivity_show_results
      activity: "{Topic.TicketSummary}"

    - kind: SendActivity
      id: sendActivity_closing
      activity: La tua segnalazione è stata inviata all'helpdesk. Un operatore ti ricontatterà a breve.

    - kind: HttpRequestAction
      id: pN6Ixo
      method: Post
      url: https://muskrat-loved-openly.ngrok-free.app/api/mail/mailsenderjobcopilot
      body:
        kind: JsonRequestContent
        content:
          codiceFiscalePartitaIva: DEMO00000000000
          codiceIpa: C_B819
          cognome: Demo
          crmTickets: =Topic.tickets
          descrizioneProblema: =Global.TestoSegnalazione
          mail: =System.User.Email
          nome: =System.User.DisplayName
          nomeEnte: Carpi
          telefono:
          tipologiaSegnalazione: =Global.CategoriaSegnalazione

      errorHandling:
        kind: ContinueOnErrorBehavior

inputType: {}
outputType: {}