      - ricevuta non scaricabile
      - non riesco a scaricare la ricevuta
      - download ricevuta non funziona
      - errore durante il pagamento
      - errore pagamento pagoPA
      - pagamento fallito
      - pagamento respinto
      - pagamento annullato
      - pagamento bloccato
      - transazione non riuscita
      - transazione rifiutata
      - esito pagamento negativo
      - pagamento in attesa
      - pagamento sospeso
      - pagamento duplicato
      - ho pagato ma non risulta
      - ho effettuato il pagamento ma non lo vedo
      - pagamento eseguito ma non registrato
      - pagamento addebitato ma non confermato
      - addebito senza ricevuta
      - mi hanno addebitato due volte
      - doppio pagamento
      - pagamento contabilizzato male
      - importo errato
      - importo non corretto
      - cifra addebitata diversa
      - errore importo pagamento
      - avviso non trovato
      - codice avviso non valido
      - IUV non valido
      - IUV non riconosciuto
      - codice pagamento errato
      - QR code non funziona
      - errore codice fiscale
      - ente non trovato
      - ente creditore non disponibile
      - servizio temporaneamente non disponibile
      - errore tecnico
      - errore di sistema
      - pagina di pagamento non disponibile
      - timeout durante il pagamento
      - sessione scaduta
      - accesso non riuscito
      - problema autenticazione
      - SPID non funziona
      - CIE non funziona
      - errore accesso pagoPA
      - errore durante autenticazione
      - carta non accettata
      - pagamento con carta non riuscito
      - IBAN non valido
      - errore banca
      - errore PSP
      - problema con il prestatore di servizi di pagamento
      - pagamento non autorizzato
      - errore verifica pagamento
      - stato pagamento sconosciuto
      - non riesco a recuperare la ricevuta
      - non riesco a recuperare il pagamento
      - non trovo la transazione
      - ricevuta telematica non disponibile
      - RT non disponibile
      - RT non trovata
      - quietanza non disponibile
      - quietanza non trovata
      - pagamento non aggiornato
      - pagamento non sincronizzato
      - pagamento ancora pendente
      - ricevuta arrivata in ritardo
      - email ricevuta non arrivata
      - notifica pagamento non ricevuta
      - conferma pagamento assente
      - problema con avviso pagoPA
      - errore compilazione pagamento
      - errore inserimento dati
      - errore durante conferma pagamento
      - pagamento interrotto
      - pagamento non completato
      - operazione non conclusa
      - impossibile completare il pagamento
      - impossibile verificare il pagamento
